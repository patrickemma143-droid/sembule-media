name: Deploy website via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the FTP sync without uploading or deleting files
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Require confirmed FTP settings and a full backup/review of the existing Bluehost site.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website files
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate deployment flags and FTP settings
        shell: bash
        env:
          FTP_DEPLOY_ENABLED: ${{ vars.FTP_DEPLOY_ENABLED }}
          FTP_DEPLOY_READY: ${{ vars.FTP_DEPLOY_READY }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR }}
        run: |
          missing=0
          for name in FTP_DEPLOY_ENABLED FTP_DEPLOY_READY; do
            value="${!name}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            value="${value,,}"
            if [[ "$value" != "true" ]]; then
              printf -v shown '%q' "${!name}"
              echo "Deployment blocked: ${name} must be true (received ${shown})."
              missing=1
            fi
          done
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Sync website files to the FTP host
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          log-level: standard
